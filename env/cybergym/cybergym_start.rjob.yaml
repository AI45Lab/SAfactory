agent_name: cybergym

container:
  workdir: /workspace/cybergym

  runner_entrypoint:
    source: ./runner.sh
    target: /workspace/cybergym/runner.sh
    command: "bash /workspace/cybergym/runner.sh"

  env:
    CYBERGYM_ROOT: /workspace/cybergym
    CYBERGYM_DATA_DIR: /workspace/cybergym/cybergym_data/data
    CYBERGYM_IMAGE_ARCHIVE_DIR: /workspace/cybergym/images
    CYBERGYM_RESULTS_ROOT: /workspace/cybergym/results

    CYBERGYM_DOCKER_MODE: dind
    CYBERGYM_DOCKER_ROOT: /docker-data
    CYBERGYM_RUNNER_ROOT: /workspace/cybergym

    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
    PYTHONDONTWRITEBYTECODE: "1"

    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    ALL_PROXY: ""
    http_proxy: ""
    https_proxy: ""
    all_proxy: ""
    NO_PROXY: localhost,127.0.0.1,::1
    no_proxy: localhost,127.0.0.1,::1

rjob:
  name_prefix: cybergym
  private_machine: Group
  image_pull_policy: IfNotPresent
  no_packaging: true
  cleanup_on_finish: true
  keep_failed_jobs: true

  # DinD requires a privileged controller. Image loading and verifier builds
  # also need substantially more local disk than the OpenRT example.
  privileged: true
  # share_host_shm: true
  # local_storage_in_mb: 40960
  # termination_grace_period_seconds: 60

  resources:
    cpu: 2
    gpu: 0
    memory_in_mb: 10240
    custom_resources:
      - "brainpp.cn/fuse=1"

  # These GPFS locations follow env/openrt/openrt_start.rjob.yaml. Change the
  # source side if CyberGym assets live elsewhere in the cluster.
  mount_config:
    - "gpfs://gpfs2/trustcyberdata/public/forEval/forMining/cybergym/cybergym-data:/workspace/cybergym/cybergym_data"
    - "gpfs://gpfs2/trustcyberdata/public/forEval/forMining/cybergym/cybergym-registry-v2-image-cache:/workspace/cybergym/images"
    - "gpfs://gpfs2/trustcyberdata/bindev/level2/Safactory/results:/workspace/cybergym/results"
