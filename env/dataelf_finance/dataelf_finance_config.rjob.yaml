environments:
  - env_name: dataelf_finance
    # Replace with a cluster-pullable registry image built from
    # env/dataelf_finance/Dockerfile before live RJob runs.
    env_image: registry.h.pjlab.org.cn/ailab-evobox-evobox_cpu_task/safactory_bench:dataelf-finance-v0.2
    env_num: 1
    dataset: ./datasets/ddr10k_bench_100.jsonl
    dataset_load_mode: eager
    env_params:
      task_family: dataelf_finance
      # Must equal the results mount target in dataelf_finance_start.rjob.yaml.
      results_root: /app/results
      dataelf:
        # DataElf checkout baked into the image at /opt/DataElf.
        repo_root: /opt/DataElf
        benchmark: ddr_10k
        # Cluster-visible mount of the 1.1 GB SQLite database (see
        # rjob.mount_config in dataelf_finance_start.rjob.yaml); linked, not
        # copied, into each job workspace.
        db_path: /workspace/DDR_Bench/data/10k/raw/10k_financial_data.db
        tools:
          sql: true
          python: true
          web: false
        max_tool_calls: 600
        # Real explorations run 1.5h+ (smoke-2 took 1h35m); the previous 1h
        # budget truncated smoke-1 mid-run ("Pi CLI timed out after 3600
        # seconds").
        max_runtime_seconds: 14400
        # Strip cumulative message_update snapshots from pi_events.jsonl
        # (see dataelf_finance_config.yaml).
        compact_stream_events: true
        # pi's default HTTP idle timeout kills long tool-call gaps (smoke-1
        # auto-retried because of it); raise to 15 min.
        pi_settings:
          httpIdleTimeoutMs: 900000
      # ---- Evaluation stage (manager-side, after each episode) ----
      # Deployment facts only; judge endpoints / reward modes are read by
      # the reward calculator from <dataelf_eval root>/eval/config.yaml
      # (see dataelf_finance_config.yaml). The rule evaluator ONLY produces
      # the RL training reward; official scoring is replayed post-hoc by
      # dataelf_eval. Unregistered benchmarks fail loudly. eval_timeout_s
      # is read by manager/simulation_worker.py after spec discovery
      # (see dataelf_finance_config.yaml); 3600 covers the judge worst case.
      eval_timeout_s: 3600
      dataelf_eval:
        root: /mnt/shared-storage-user/evobox-share/chenbei/dataelf_eval
        # Must equal env_params.results_root above (the RJob results mount
        # target) — NOT the docker twin's /workspace/Safactory/results.
        container_results_root: /app/results
        host_results_root: /mnt/shared-storage-user/evobox-share/chenbei/SAfactory/results
