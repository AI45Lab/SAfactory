environments:
  # Base evaluation set - 基础评测集
  - env_name: embodied_alfred
    env_image: embodiedbench/alfred:latest  # 可选的 Docker 镜像
    env_num: 1  # 创建 2 个并行实例
    env_params:
      eval_set: "spatial"
      down_sample_ratio: 1.0
      resolution: 500
      detection_box: false
      max_episode_steps: 50
      max_invalid_actions: 10
      exp_name: "aievobox_alfred_base"

