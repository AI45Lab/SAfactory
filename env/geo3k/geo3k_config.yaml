environments:
  - env_name: geo3k
    env_image: python:3.11-slim
    env_num: 1
    # Geo3K-VL parquet with columns: problem, answer, images (image data urls).
    # Reused from the v1 geo3k_vl_test dataset. Point this at your parquet path.
    dataset: ./datasets/geo3k_vl_train.parquet
    dataset_load_mode: parquet_row_ref

    env_params:
      task_family: geo3k
      # Runtime options (were geo3k_vl_test_env_runtime.yaml in v1).
      max_turns: 3
      max_images: 1
      echo_images_on_feedback: false
