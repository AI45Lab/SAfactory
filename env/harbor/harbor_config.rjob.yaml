environments:
  - env_name: harbor
    env_image: registry.h.pjlab.org.cn/ailab-evobox-evobox_cpu/benches:safactory-harbor-runtime-v0.25.0-opencode-mount
    env_num: 1
    dataset: ./datasets/harbor_oracle_smoke.jsonl
    dataset_load_mode: eager

    env_params:
      task_family: harbor
      bundle_root: /mnt/shared-storage-gpfs2/trustcyberdata/private/wuyida/GhAdvDB/batch_20260918
      # Agent 设置（agent/model/reasoning_effort/agent_runtime/agent_env/超时）
      # 不在这里配置：它们在 Harbor job 模板里，由 runner 渲染成
      # <episode>/harbor/harbor-config.yaml 后执行 `harbor run -c ... --yes`。
      # 启动配置需把该模板投递到下面这个路径（Sandbox 模式用同一路径）。
      harbor_template: /opt/safactory-harbor/templates/harbor_config.claude-code-2.1.207-glm-5.2.yaml
      reward_key: reward
      timeout_s: 36000
