environments:
  - env_name: harbor
    env_image: registry.h.pjlab.org.cn/ailab-evobox-evobox_cpu/benches:safactory-harbor-runtime-v0.23.0
    env_num: 1
    # Replace with your local task list (relative to this file); never fetched from S3.
    dataset: ./datasets/task_id_all.jsonl
    dataset_load_mode: eager
    env_params:
      task_family: harbor
      bundle_source:
        type: s3
        profile: harbor_inputs
        download_timeout_s: 1800
        download_concurrency: 4
      bundle_root: /work/harbor/bundle
      profile_subdir: harbor-runtime-profile
      image_load_mode: task
      agent: claude-code
      model: GLM-5.3-W4A8C8
      reasoning_effort: max
      agent_runtime:
        source: /opt/afs-agent-bin/claude
        version: "2.1.207"
      agent_env:
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        DISABLE_AUTOUPDATER: "1"
        IS_SANDBOX: "1"
      reward_source: runner
      reward_key: reward
      timeout_s: 30000
