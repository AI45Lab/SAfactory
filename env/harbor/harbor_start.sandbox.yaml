agent_name: harbor

container:
  workdir: /work
  runner_entrypoint:
    # The manager resolves this source relative to this start file and copies
    # it into /work/safactory/instances/<sandbox-id>/runner.py for this instance.
    source: ./runner.py
    target: /work/safactory/runner.py
    command: "/opt/harbor-env/bin/python /work/safactory/runner.py"

  env:
    HARBOR_TELEMETRY: "0"
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    # Standard Docker-in-Sandbox mode. The runner starts dockerd on this socket.
    SAFACTORY_DOCKER_MODE: "sandbox"
    DOCKER_HOST: "unix:///var/run/docker.sock"
    # Harbor job 模板（agent/model/env/mounts/超时）。runner 把它渲染成
    # 本次 episode 的 harbor-config.yaml 后执行 `harbor run -c ... --yes`。
    SAFACTORY_HARBOR_TEMPLATE: "/opt/safactory-harbor/templates/harbor_config.sandbox-2.1.207-GLM-5.3-W4A8C8.yaml"

sandbox:
  embedded_files:
    - source: ./templates/harbor_config.sandbox-2.1.207-GLM-5.3-W4A8C8.yaml
      target: /opt/safactory-harbor/templates/harbor_config.sandbox-2.1.207-GLM-5.3-W4A8C8.yaml
  command_port: 44772
  idle_entrypoint:
    - tail
    - -f
    - /dev/null
  resource:
    cpu: "4"
    memory: "16Gi"
  extensions:
    project: "ailab-evobox"
    runtimeClassName: "sysbox-runc"
  lifecycle_minutes: 720
  cleanup_on_finish: true
