environments:
  - env_name: livecvebench
    env_image: registry.h.pjlab.org.cn/ailab-evobox-evobox_cpu/benches:livecvebench-runner-20260728-rjob1
    env_num: 1
    dataset: ./datasets/livecvebench_and_patcheval_verified.jsonl
    dataset_load_mode: eager

    env_params:
      task_family: cve_patch
      dataset_paths:
        livecvebench: /benchmark/tasks/LiveCVEBench-verified
        patcheval: /benchmark/tasks/PatchEval-verified
      output_root: /benchmark/runs
      agent: oracle
      n_concurrent: 1
      global_test_timeout_sec: 900
      timeout_s: 960
