environments:
  - env_name: os_gym
    env_image: ailab-evobox-evobox_cpu/evoboxenv:latest
    env_num: 1
    dataset: datasets/osworld_cases.jsonl  # JSONL dataset file with task configurations
    env_params:
      benchmark_type: "osworld"  # "riosworld" or "osworld"
      provider_name: "docker"
      observation_type: "screenshot_a11y_tree"
      headless: true
      action_space: "pyautogui"
      screen_width: 1920
      screen_height: 1080
      cache_dir: "/tmp/osgym_cache"
      result_dir: "/home/zhangyang/files/AIEvoBox_results/osgym_results"
      save_screenshots: true
      enable_recording: true
