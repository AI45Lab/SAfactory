environments:
  - env_name: prmeval
    env_image: registry.h.pjlab.org.cn/ailab-evobox-evobox_proxy/safactory_prmeval:0.2.0
    env_num: 1
    dataset: ./datasets/samples.jsonl
    dataset_load_mode: eager
    env_params:
      task_family: prmeval
      results_root: /app/results
      native_timeout_s: 600
      prmeval:
        sampling:
          dataset_name: rbm_1m_ood_test
          paths: [/tmp/safactory-prmeval-tempfile/temp_sample.jsonl]
          base_frames: 8
          progress_type: absolute_first_frame
        infer:
          name: openai_compatible
          model_extra_config:
            keep_base_url: true
        eval_types: progress
