environments:
  - env_name: prmeval
    # Built from env/prmeval/Dockerfile with the prmeval wheel and runtime dependencies.
    env_image: safactory-prmeval:0.2.0
    env_num: 1
    dataset: ./datasets/samples.jsonl
    dataset_load_mode: eager

    env_params:
      task_family: prmeval
      # Keep native artifacts and the SAfactory result JSON on the shared
      # result mount declared in prmeval_start.yaml.
      results_root: /workspace/Safactory/results
      prmeval:
        sampling:
          dataset_name: rbm_1m_ood_test
          # adapter.py replaces paths with a temporary one-row JSONL per episode.
          paths: []
          base_frames: 8
          progress_type: absolute_first_frame
        infer:
          name: openai_compatible
          model_extra_config:
            keep_base_url: true
        eval_types: progress

