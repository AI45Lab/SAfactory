agent_name: prmeval
container:
  workdir: /workspace
  runner_entrypoint:
    source: ./runner.py
    target: /tmp/safactory-prmeval/runner.py
    command: python /tmp/safactory-prmeval/runner.py
  env:
    PYTHONDONTWRITEBYTECODE: "1"
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    ALL_PROXY: ""
    http_proxy: ""
    https_proxy: ""
    all_proxy: ""
    NO_PROXY: ""
    no_proxy: ""
rjob:
  name_prefix: prmeval
  private_machine: Group
  image_pull_policy: IfNotPresent
  no_packaging: true
  cleanup_on_finish: true
  keep_failed_jobs: true
  resources:
    cpu: 2
    gpu: 0
    memory_in_mb: 4096
  mount_config:
    # Replace CLUSTER_STORAGE with a location visible to the RJob cluster.
    - "gpfs://CLUSTER_STORAGE/SAfactory/results:/app/results"
    # Mount the dataset directory at the path stored in samples.jsonl.
    - "gpfs://CLUSTER_STORAGE/SAfactory/env/prmeval/datasets:/tmp/safactory-prmeval/datasets"
  embedded_files:
    # runner.py is embedded automatically from runner_entrypoint.source.
    - source: ./adapter.py
      target: /tmp/safactory-prmeval/adapter.py
