evaluation:
  max_concurrency: 4
  fail_policy: zero_reward

  evaluator_agent_pools:
    - pool_id: local-codex-agent-eval
      selection_policy: least_busy
      members:
        - evaluator_agent_id: local-codex-evaluator
          agent_type: codex_cli
          base_agent: codex
          pool_size: 4
          workdir: ${PWD}
          # Leave model empty to use the local Codex CLI default, or set a
          # Codex CLI model such as gpt-5.3-codex.
          model: ""
          sandbox: read-only
          approval_policy: never
          ephemeral: true
          allowed_target_access_modes:
            - snapshot
            - brokered_container
