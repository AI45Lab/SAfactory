# Safe container defaults. Mount a replacement config to set real route keys,
# upstream URLs, credentials, and production telemetry policies.
listen_host: 0.0.0.0
listen_port: 8000
base_session_path: /v1/sessions
max_steps: -1

storage_type: cloud
storage_config: {}

telemetry:
  mode: strict
  loss_policy: fail_closed
  capture_payload: full
  payload_sample_rate: 1.0
  redact_sensitive_fields: true
  batch_size: 200
  flush_interval_ms: 100

request_log:
  enabled: true
  path: /app/logs/gateway_requests.jsonl
  max_bytes: 104857600
  backup_count: 5
  body_limit_bytes: 0

llm_routes:
  default:
    base_url: http://host.docker.internal:8001/v1
    api_key: null
    supports_stream: true
    max_concurrency: 256
