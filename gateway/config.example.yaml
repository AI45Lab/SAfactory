listen_host: 0.0.0.0
listen_port: 8080
base_session_path: /v1/sessions
# -1 means unlimited. 0 returns Stop immediately. N allows N real LLM requests per session.
max_steps: -1

storage_type: sqlite
storage_config:
  # Cloud mode uses wt-data-gateway default database URIs.
  # Development writes trajectory rows to wt-data-gateway test tables by default.
  # landing_table: landing_test
  # serving_table: serving_test
  # env_config_table: evaluation_env_config

max_inflight_requests: 2048
max_active_streams: 1024
max_queue_size: 4096
upstream_max_connections: 512
upstream_http_proxy: null
upstream_no_proxy:
  - 127.0.0.1
  - localhost
per_llm_route_max_concurrency: 256
per_session_max_inflight: 64

telemetry:
  mode: strict
  loss_policy: fail_closed
  capture_payload: full
  payload_sample_rate: 1.0
  redact_sensitive_fields: true
  batch_size: 200
  flush_interval_ms: 100

request_log:
  enabled: true
  path: logs/gateway_requests.jsonl
  max_bytes: 104857600
  backup_count: 5
  # 0 means unlimited body capture so agent prompts and streamed LLM output are not truncated.
  body_limit_bytes: 0

llm_routes:
