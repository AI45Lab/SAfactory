mode: docker

database:
  driver: "sqlite"
  sqlite_path: "env_trajs.db"

pool_size: 2

evaluation:
  enabled: true
  mode: inline
  max_concurrency: 64
  fail_policy: zero_reward
  default_specs: []

reward:
  scale: 10
  trainable_policy: all_steps_after_eval
  commit_target: terminal_step

cluster:
  docker:
    bin: "docker"
    name_prefix: "safactory-openclaw"
    pull_policy: "never"              # never | always
    startup_concurrency: 8
    cleanup_container_on_finish: true # false keeps containers after rollout/evaluation for debugging
    remove_on_close: true
    idle_command: "tail -f /dev/null"

    # Container reuse is opt-in by default. A reusable container is kept only
    # after the run succeeds, cleanup succeeds, and healthcheck succeeds.
    reuse_policy: "explicit"          # explicit | always | never
    default_reuse_container: false
    max_runs_per_container: 0         # 0 means unlimited when reuse is enabled

    # Safactory copies clusters/openclaw_safactory_runner.mjs into each
    # container. The runner reads one SimulationStartRequest JSON document from
    # stdin, configures OpenClaw to use the Safactory gateway session URL, runs
    # a real `openclaw agent --local` turn, and writes one
    # SimulationStartResult-compatible JSON document to stdout.
    runner_container_path: "/tmp/safactory-openclaw-runner.mjs"
    install_runner_script: true
    run_command: "node /tmp/safactory-openclaw-runner.mjs"
    cleanup_command: ""
    healthcheck_command: ""

  rjob:
    # Switch top-level mode to "rjob" to run each episode as one RJob job.
    # cluster_entry/namespace/access keys may also come from the RJobClient
    # environment or auth files.
    cluster_entry: ""
    namespace: ""
    access_key: ""
    secret_key: ""
    verifyssl: true
    retries: 3
    charged_group: ""
    poll_interval_s: 5
    cleanup_on_finish: true
    keep_failed_jobs: false
    no_packaging: true
    name_prefix: "safactory"
    auto_delete_duration: "12h"
    gateway_base_url: ""              # must be reachable from RJob containers
    default_resources:
      cpu: 1
      gpu: 0
      memory_in_mb: 1024

  env_types:
    openclaw:
      docker:
        reuse_container: false
        run_command: "node /tmp/safactory-openclaw-runner.mjs"
        cleanup_command: ""
        healthcheck_command: ""
        volumes: []
        env: {}
        extra_args: []
      rjob:
        resources:
          cpu: 1
          gpu: 0
          memory_in_mb: 1024
        mount_config: []
