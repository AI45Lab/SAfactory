# Global RJob connection/auth settings shared by all environments.
# Usage with manager:
#   python launcher.py --mode rjob --rjob-config manager/rjob_auth.example.yaml \
#     --agent-config env/openrt/openrt_config.yaml \
#     --agent-start-config env/openrt/openrt_start.yaml
#
# Usage with the standalone submit script:
#   python scripts/submit_openrt_rjob.py --config manager/rjob_auth.example.yaml ...

rjob:
  cluster_entry: ""
  namespace: ""
  access_key: ""
  secret_key: ""
  verifyssl: true
  retries: 3

  # Optional but commonly shared across RJob submissions.
  charged_group: ""
  gateway_base_url: ""
  name_prefix: ort
  poll_interval_s: 5
  cleanup_on_finish: true
  keep_failed_jobs: false
  no_packaging: true
  auto_delete_duration: 12h
  submit_concurrency: 1
